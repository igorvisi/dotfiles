theme = "one-dark"

# One Dark — palette reprise de ~/.config/kitty/kitty.conf.
# Surfaces, accents et fonds de diff sont dérivés de cette palette avec les
# algorithmes de contraste WCAG utilisés par Hunk (blend/readability).
[themes.one-dark]
label = "One Dark"
base = "one-dark-pro"
background = "#23272e"
panel = "#2e323a"
panelAlt = "#33383f"
border = "#3b4048"
accent = "#61afef"
accentMuted = "#31465a"
text = "#abb2bf"
muted = "#b1b3b6"
addedBg = "#313a37"
removedBg = "#45333b"
movedAddedBg = "#463e39"
movedRemovedBg = "#463e39"
contextBg = "#23272e"
addedContentBg = "#3c483e"
removedContentBg = "#583a42"
contextContentBg = "#23272e"
addedSignColor = "#98c379"
removedSignColor = "#e06c75"
lineNumberBg = "#23272e"
lineNumberFg = "#abadb0"
selectedHunk = "#4f443c"
badgeAdded = "#98c379"
badgeRemoved = "#eb9fa5"
badgeNeutral = "#b1b3b6"
fileNew = "#98c379"
fileDeleted = "#eb9fa5"
fileRenamed = "#d19a66"
fileModified = "#d19a66"
fileUntracked = "#98c379"
noteBorder = "#d19a66"
noteBackground = "#2e323a"
noteTitleBackground = "#2e323a"
noteTitleText = "#abb2bf"
