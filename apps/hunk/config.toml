theme = "one-dark"

# One Dark — aligné sur le thème `one-dark` d'OpenCode (fond #282c34,
# panneaux #21252b, éléments #353b45, bords #393f4a, fonds de diff
# #2c382b / #3a2d2f, numéros de ligne #9398a2).
# Les teintes secondaires sont dérivées de ces valeurs avec les
# algorithmes de contraste WCAG utilisés par Hunk.
[themes.one-dark]
label = "One Dark"
base = "one-dark-pro"
background = "#282c34"
panel = "#21252b"
panelAlt = "#353b45"
border = "#393f4a"
accent = "#61afef"
accentMuted = "#334659"
text = "#abb2bf"
muted = "#b2b5b8"
addedBg = "#2c382b"
removedBg = "#3a2d2f"
movedAddedBg = "#4a423e"
movedRemovedBg = "#4a423e"
contextBg = "#282c34"
addedContentBg = "#3c4740"
removedContentBg = "#583d45"
contextContentBg = "#282c34"
addedSignColor = "#98c379"
removedSignColor = "#e06c75"
lineNumberBg = "#282c34"
lineNumberFg = "#9398a2"
selectedHunk = "#524841"
badgeAdded = "#98c379"
badgeRemoved = "#eb9fa5"
badgeNeutral = "#b2b5b8"
fileNew = "#98c379"
fileDeleted = "#eb9fa5"
fileRenamed = "#d19a66"
fileModified = "#d19a66"
fileUntracked = "#98c379"
noteBorder = "#d19a66"
noteBackground = "#21252b"
noteTitleBackground = "#21252b"
noteTitleText = "#abb2bf"
