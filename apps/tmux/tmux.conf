set-option -sa terminal-overrides ",xterm*:Tc"
# Need to scroll with mouse/trackpad
set -g mouse on

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# Change prefix key
#unbind C-b
#set -g prefix C-Space
#bind C-Space send-prefix

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# make window/pane index start with 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
# Follow the most recently active terminal when its display size changes.
set-option -g window-size latest
set -g status-position top


set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Catppuccin layout with a One Dark palette.
set -g @thm_bg '#23272e'
set -g @thm_fg '#abb2bf'
set -g @thm_rosewater '#e6efff'
set -g @thm_flamingo '#e06c75'
set -g @thm_pink '#c678dd'
set -g @thm_mauve '#c678dd'
set -g @thm_red '#e06c75'
set -g @thm_maroon '#be5046'
set -g @thm_peach '#d19a66'
set -g @thm_yellow '#e5c07b'
set -g @thm_green '#98c379'
set -g @thm_teal '#56b6c2'
set -g @thm_sky '#56b6c2'
set -g @thm_sapphire '#61afef'
set -g @thm_blue '#61afef'
set -g @thm_lavender '#61afef'
set -g @thm_subtext_1 '#abb2bf'
set -g @thm_subtext_0 '#828791'
set -g @thm_overlay_2 '#5c6370'
set -g @thm_overlay_1 '#4b5263'
set -g @thm_overlay_0 '#3e4451'
set -g @thm_surface_2 '#3b3f4c'
set -g @thm_surface_1 '#2c313a'
set -g @thm_surface_0 '#23272e'
set -g @thm_mantle '#21252b'
set -g @thm_crust '#1e2127'

set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @ssh_window_label '#{?#{||:#{m/r:(^| )(ssh|ssh[.]exe)( |$),#{P:#{pane_current_command} }},#{m/r:1,#{P:#{?#{&&:#{==:#{pane_current_command},init},#{m/r:^[^@ ]+@[A-Za-z0-9._-]+,#{pane_title}}},1,}}}},󰒋 SSH #{P:#{?#{&&:#{m/r:^[^@ ]+@[A-Za-z0-9._-]+,#{pane_title}},#{||:#{m/r:^(ssh|ssh[.]exe)$,#{pane_current_command}},#{==:#{pane_current_command},init}}},#{s/^.*@([A-Za-z0-9._-]+).*/\1/:pane_title},}},#{b:pane_current_path}}'
set -g @catppuccin_window_text ' #{E:@ssh_window_label}'
set -g @catppuccin_window_current_text ' #{E:@ssh_window_label}'
set -g @catppuccin_window_text_color '#23272e'
set -g @catppuccin_window_current_text_color '#21252b'
set -g @catppuccin_window_current_number_color '#98c379'
set -g @catppuccin_status_background '#21252b'
set -g @catppuccin_date_time_text '%d/%m/%Y %H:%M'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-bind 'o'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-strategy-nvim 'session'
set -g status-left '#{E:@catppuccin_status_session}'
set -g status-right '#{E:@catppuccin_status_date_time}'
run '~/.tmux/plugins/tpm/tpm'
