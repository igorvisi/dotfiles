[window]
decorations = "None"
padding = { x = 14, y = 14 }

[scrolling]
history = 100000

[env]
TERM = "xterm-256color"

[font]
size = 13.0

[font.normal]
family = "Maple Mono"
style = "Regular"

[font.bold]
family = "Maple Mono"
style = "Bold"

[colors.primary]
background = "#1e2229"
foreground = "#abb2bf"
dim_foreground = "#5c6370"
bright_foreground = "#c8ccd4"

[colors.cursor]
text = "#282c34"
cursor = "#abb2bf"

[colors.selection]
text = "#abb2bf"
background = "#3e4451"

[colors.normal]
black = "#282c34"
red = "#e06c75"
green = "#98c379"
yellow = "#e5c07b"
blue = "#61afef"
magenta = "#c678dd"
cyan = "#56b6c2"
white = "#abb2bf"

[colors.bright]
black = "#5c6370"
red = "#e06c75"
green = "#98c379"
yellow = "#e5c07b"
blue = "#61afef"
magenta = "#c678dd"
cyan = "#56b6c2"
white = "#c8ccd4"

[colors.dim]
black = "#21252b"
red = "#be5046"
green = "#7da869"
yellow = "#d19a66"
blue = "#528bff"
magenta = "#a678dd"
