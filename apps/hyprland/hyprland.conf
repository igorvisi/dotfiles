# Isolated Hyprland profile inspired by Omarchy Quattro's geometry and motion.
# Colors are Igor's existing One Dark Two palette; Niri and Noctalia are untouched.

monitor = eDP-1, 1920x1200@60, 1536x0, 1.3
monitor = HDMI-A-1, 1920x1080@59.995, 0x0, 1.25
monitor = DP-1, 1920x1080@60, 3072x0, 1
monitor = , preferred, auto, 1

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = LANG,fr_FR.UTF-8
env = LANGUAGE,fr_FR:fr
env = LC_MESSAGES,fr_FR.UTF-8
env = LC_TIME,fr_FR.UTF-8

$terminal = alacritty --config-file $HOME/.config/hyprland-quattro/alacritty/alacritty.toml
$fileManager = nautilus
$launcher = $HOME/.config/hyprland-quattro/scripts/launcher.sh
$lock = $HOME/.config/hyprland-quattro/scripts/lock.sh

exec-once = dbus-update-activation-environment --systemd --all
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11,ssh
exec-once = /usr/lib/goa-daemon --replace
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = $launcher --gapplication-service
exec-once = $HOME/.config/hyprland-quattro/scripts/quattro-shell.sh
exec-once = dunst -conf $HOME/.config/hyprland-quattro/quattro/dunstrc
exec-once = $HOME/.config/hyprland-quattro/scripts/wallpaper.sh
exec-once = swayidle -w timeout 300 "$lock" timeout 330 "hyprctl dispatch dpms off" resume "hyprctl dispatch dpms on" before-sleep "$lock"
exec-once = systemctl --user start voxtype.service
exec-once = $HOME/dotfiles/script/wayvibes-multi.sh

input {
    kb_layout = fr
    kb_model = pc105
    kb_options = terminate:ctrl_alt_bksp
    numlock_by_default = true

    touchpad {
        tap-to-click = true
        natural_scroll = false
    }
}

general {
    layout = dwindle
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(61afef)
    col.inactive_border = rgba(5c6370aa)
    resize_on_border = false
}

group {
    col.border_active = rgb(61afef)
    col.border_inactive = rgba(5c6370aa)

    groupbar {
        font_size = 12
        font_family = Maple Mono
        font_weight_active = ultraheavy
        font_weight_inactive = normal
        indicator_height = 1
        indicator_gap = 5
        height = 22
        gaps_in = 5
        gaps_out = 0
        text_color = rgb(abb2bf)
        text_color_inactive = rgba(abb2bf90)
        col.active = rgba(1e222940)
        col.inactive = rgba(1e222920)
        gradients = true
        gradient_rounding = 0
        gradient_round_only_edges = false
    }
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = quattroOut, 0.23, 1, 0.32, 1
    bezier = quattroLinear, 0, 0, 1, 1
    bezier = quattroAlmostLinear, 0.5, 0.5, 0.75, 1
    bezier = quattroQuick, 0.15, 0, 0.1, 1
    animation = windowsIn, 1, 4.1, quattroOut, popin 87%
    animation = windowsOut, 1, 1.49, quattroLinear, popin 87%
    animation = windowsMove, 1, 3.79, quattroOut
    animation = fadeIn, 1, 1.73, quattroAlmostLinear
    animation = fadeOut, 1, 1.46, quattroAlmostLinear
    animation = fade, 1, 3.03, quattroQuick
    animation = layers, 1, 3.81, quattroOut
    animation = layersIn, 1, 4, quattroOut, fade
    animation = layersOut, 1, 1.5, quattroLinear, fade
    animation = workspaces, 0
    animation = specialWorkspace, 1, 3, quattroOut, slidevert
}

dwindle {
    preserve_split = true
    force_split = 2
    smart_split = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

workspace = 1, monitor:eDP-1, default:true
workspace = 2, monitor:DP-1, default:true
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:HDMI-A-1, default:true
workspace = 6, monitor:HDMI-A-1

windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = workspace 1 silent, match:class ^(Alacritty)$
windowrule = workspace 2 silent, match:class ^(dev\.zed\.Zed)$
windowrule = workspace 3 silent, match:class ^(com\.brave\.Browser|brave-browser|Brave-browser)$
windowrule = workspace 3 silent, match:class ^(chatgpt|ChatGPT)$
windowrule = workspace 3 silent, match:class ^(com\.nousresearch\.hermes)$
windowrule = workspace 4 silent, match:class ^(obsidian)$
windowrule = workspace 5 silent, match:class ^(Spotify)$
windowrule = workspace 6 silent, match:class ^(org\.telegram\.desktop)$

$mainMod = SUPER

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, RETURN, exec, brave
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, SPACE, exec, $launcher
bind = $mainMod, V, exec, $launcher -m clipboard
bind = $mainMod CTRL, L, exec, $lock
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod ALT, F, fullscreenstate, 1 2
bind = $mainMod, T, togglefloating
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, G, togglegroup
bind = $mainMod, S, togglespecialworkspace, scratchpad
bind = $mainMod ALT, S, movetoworkspacesilent, special:scratchpad
bind = $mainMod SHIFT, SPACE, exec, $HOME/.config/hyprland-quattro/scripts/quattro-bar-toggle.sh
bind = $mainMod SHIFT, Q, exec, uwsm stop

bind = $mainMod, LEFT, movefocus, l
bind = $mainMod, RIGHT, movefocus, r
bind = $mainMod, UP, movefocus, u
bind = $mainMod, DOWN, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod SHIFT, LEFT, swapwindow, l
bind = $mainMod SHIFT, RIGHT, swapwindow, r
bind = $mainMod SHIFT, UP, swapwindow, u
bind = $mainMod SHIFT, DOWN, swapwindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, TAB, workspace, e+1
bind = $mainMod SHIFT, TAB, workspace, e-1
bind = $mainMod CTRL, TAB, workspace, previous
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+ -l 1.0
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioStop, exec, playerctl stop
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next
bindel = , XF86MonBrightnessUp, exec, brightnessctl --class=backlight set +10%
bindel = , XF86MonBrightnessDown, exec, brightnessctl --class=backlight set 10%-
