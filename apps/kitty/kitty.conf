# Minimal One Dark terminal UI.

# Typography
font_family      Maple Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Cursor trail
cursor_trail       3
cursor_trail_decay 0.1 0.4

# Window
hide_window_decorations yes
window_padding_width     0
background_opacity       1.0
startup_session          startup.conf

# Keep the interface visually minimal.
tab_bar_style hidden

# Scrollback
scrollback_lines 100000

# Broad SSH compatibility for servers without Kitty's terminfo entry.
term xterm-256color

# One Dark palette
foreground #abb2bf
background #23272E

color0  #1e2127
color1  #e06c75
color2  #98c379
color3  #d19a66
color4  #61afef
color5  #c678dd
color6  #56b6c2
color7  #828791
color8  #5c6370
color9  #e06c75
color10 #98c379
color11 #d19a66
color12 #61afef
color13 #c678dd
color14 #56b6c2
color15 #e6efff
