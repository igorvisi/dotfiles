onboarding = false

# Custom Theme
[theme]
name = "one-dark"
[theme.custom]
panel_bg = "#282c34"
accent = "#98c379"

# Custom Keybindings (prefix ² - touche AZERTY en haut à gauche)
[keys]
prefix = "²"
help = "prefix+?"
settings = "prefix+s"
detach = "prefix+q"
reload_config = "prefix+shift+r"

# Pane navigation (vim-style, like tmux)
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

# Splits (like tmux)
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"

# Tabs (like tmux windows)
new_tab = "prefix+c"
close_tab = "prefix+shift+x"
rename_tab = "prefix+shift+t"
next_tab = "prefix+n"
previous_tab = "prefix+p"
# AZERTY: chiffres nécessitent Shift (&=1), herdr exige 1..9 -> laisser tomber direct, utiliser ²+n/p
switch_tab = ["prefix+1", "prefix+2", "prefix+3", "prefix+4", "prefix+5", "prefix+6", "prefix+7", "prefix+8", "prefix+9"]
rename_pane = "prefix+shift+p"
edit_scrollback = "prefix+e"

# Workspaces
goto = "prefix+g"
new_workspace = "prefix+w"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
previous_workspace = "prefix+shift+h"
next_workspace = "prefix+shift+l"
open_notification_target = "prefix+o"

# Sidebar
toggle_sidebar = "prefix+b"

# Popups custom (1) - sans alt (alt peu fiable selon terminal, cf. docs herdr)
[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+y"
type = "popup"
command = "yazi"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+b"
type = "popup"
command = "btop"
width = "80%"
height = "80%"

# UI optimisations (3)
[ui]
hide_tab_bar_when_single_tab = false
tab_bar_right = [
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
  { type = "zoom" },
]
tab_bar_right_separator = " | "
pane_gaps = false
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "system"

[experimental]
pane_history = true
allow_nested = true
