# Global config (Django, FastAPI, Odoo)
target-version = "py310"
line-length = 88

[lint]
select = [
    "E",     # pycodestyle (PEP8)
    "F",     # Pyflakes
    "I",     # isort (import sorting)
    "UP",    # pyupgrade (Python 3.10+ modernization)
    "B",     # flake8-bugbear (probable bugs)
    "C90",   # McCabe (code complexity)
    "S",     # Bandit (security)
    "DJ",    # flake8-django
    "ASYNC", # flake8-async
    "T20",   # flake8-print
]

# Global ignores
ignore = [
    "E501",   # Line too long (handled by the formatter)
    "B008",   # Function calls in arguments (required by FastAPI/Odoo)
    "D100",   # Missing module-level docstring
    "ANN101", # Type 'self' (deprecated in recent versions)
]

[lint.mccabe]
max-complexity = 12

[lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "django",
    "odoo",
    "fastapi",
    "first-party",
    "local-folder"
]

[lint.isort.sections]
"django" = ["django"]
"odoo" = ["odoo"]
"fastapi" = ["fastapi", "pydantic"]

[lint.per-file-ignores]
# ODOO
"**/models/**/*.py" = ["C901"]
"**/__init__.py" = ["F401"]
# DJANGO
"**/migrations/*.py" = ["E501", "I"]
"**/settings.py" = ["E501", "F401", "S101"]
# FASTAPI
"**/routes/*.py" = ["ANN201"]
"**/tests/**/*.py" = ["S101"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
